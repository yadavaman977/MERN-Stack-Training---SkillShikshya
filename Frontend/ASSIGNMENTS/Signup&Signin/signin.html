<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin - Signup & Signin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="signinForm">
            <h2>Signin</h2>
            <label for="signinEmail">Email:</label>
            <input type="email" id="signinEmail" name="signinEmail" required>
            <label for="signinPassword">Password:</label>
            <input type="password" id="signinPassword" name="signinPassword" required>
            <button type="submit">Signin</button>
        </form>
        <p>Haven't registered yet? <a href="signup.html" id="showSignup">Signup</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
