<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* .google-link {
        display: inline-block;
        background-color: #4285F4;
      width: 200px;
      height:50px;
    } */

     .parent{
        width: 500px;
        height:500px;
        border:2px solid black;
        position: relative;
     }
     .child1{
        width: 100px;
        height: 100px;
        border: 2px solid red;
        background-color: red;
        position: relative;
        top: 0px;
        left: 0px;
        /* z-index: 1; */
     }

       .child2{
        width: 100px;
        height: 100px;
        border: 2px solid red;
        background-color: red;
        position: absolute;
        top: 40px;
        left: 40px;
        /* z-index: 1; */
     }
       .child3{
        width: 100px;
        height: 100px;
        border: 2px solid red;
        background-color: red;
        position: absolute;
        top: 0px;
        left: 0px;
        z-index: 2;
     }

       .child4{
        width: 100px;
        height: 100px;
        border: 2px solid red;
        background-color: red;
        position: absolute;
        right: 0px;
        bottom: 0px;
     }
       
     
</style>
<body>
    <!-- <a href="https://www.google.com"class="google-link" target="_blank">Visit Google</a> -->


     <div class="parent">
        <div class="child1">1</div>
        <div class="child2">2</div>
        <div class="child3">3</div>
        <div class="child4">4</div>
        <!-- /* <div class="child5">5</div>  -->
        
     </div>
</body>
</html>
