<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <div id="forms-Data" class="fixed hidden top-0 left-0 w-screen h-screen flex items-center justify-center">
    <form id="form" class="w-auto flex flex-col gap-5 bg-gray-50 h-auto p-4 border border-gray-500 shadow-xl rounded-md">
        <div class="flex items-center gap-2">
            <label for="name">Name:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="name" placeholder="Your Name">
        </div>
        <div class="flex items-center gap-2">
            <label for="username">Username:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="username" placeholder="Your Username">
        </div>
        <div class="flex items-center gap-2">
            <label for="email">Email:</label>
            <input class="w-full border p-1 rounded-md" type="email" id="email" placeholder="Your Email">
        </div>
        <div class="flex items-center gap-2">
            <label for="phone">Phone:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="phone" placeholder="Your Phone">
        </div>
        <div class="flex items-center gap-2">
            <label for="website">Website:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="website" placeholder="Your Website">
        </div >
        <div class="flex justify-center items-center gap-2">
             <button class="bg-blue-500 px-4 py-2 border-none rounded-md cursor-pointer" id="cancel" type="button">Cancel</button>
        <button class="bg-green-500 px-4 py-2 border-none rounded-md cursor-pointer" type="submit">Submit</button>
       
        </div>
    </form>
    </div>
    
            <div class="pt-20">
                <div class="flex px-7 items-center justify-between">
                    <h1 class="m-auto w-[300px] text-5xl">Users Table</h1>
                    <button id="showAdd" class="bg-blue-500 px-4 py-2 border-none rounded-md cursor-pointer">Add User</button>
                       </div>
                    <table class="w-full border">
        <thead>
            <tr class="border-b">
                <th class="border-r">ID</th>
                <th class="border-r">Name</th>
                <th class="border-r">Username</th>
                <th class="border-r">Email</th>
                <th class="border-r">Phone</th>
                <th class="border-r">Webiste</th>
            </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>
    </div>
</body>

<script>
    const tbody = document.getElementById("tbody");
    let users= []
    const modal = document.getElementById("forms-Data");
    const showAdd = document.getElementById("showAdd");
    const name = document.getElementById("name");
    const username = document.getElementById("username");
    const email = document.getElementById("email");
    const phone = document.getElementById("phone");
    const website = document.getElementById("website");

    function renderUser(){
       tbody.innerHTML = "";
       users.forEach((user)=> {
            tbody.innerHTML += `<tr>
            <td class="border-r">${user.id}</td>
            <td class="border-r">${user.name}</td>
            <td class="border-r">${user.username}</td>
            <td class="border-r">${user.email}</td>
            <td class="border-r">${user.phone}</td>
            <td class="border-r">${user.website}</td>
            </tr>`
       })
    }

    function userData(){
        return{
            name: name.value,
            username: username.value,
            email: email.value,
            phone: phone.value,
            website: website.value
        }
    }
     
    showAdd.addEventListener("click", () => {
        modal.classList.remove("hidden");
    })
    const cancel = document.getElementById("cancel");
    cancel.addEventListener("click", () => {
        modal.classList.add("hidden");
    })
   
    async function getUsers(){
        const res = await fetch("https://jsonplaceholder.typicode.com/users");
        const data= await res.json();
          users = data;
          renderUser(); 
    }
     async function addUser(user) {
         const  res = await fetch("https://jsonplaceholder.typicode.com/users", {
             method: "POST",
             headers: {
                 "Content-Type": "application/json"
             },
             body: JSON.stringify(user)
         })
         const data = await res.json();
         users.push(data);
         renderUser();
         modal.classList.add("hidden");
     }

    const form = document.getElementById("form");
    form.addEventListener("submit", (e) => {
        e.preventDefault();
        addUser(userData());
    })
    getUsers();
</script>
</html>
