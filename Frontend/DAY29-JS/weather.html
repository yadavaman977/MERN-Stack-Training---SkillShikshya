<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <h1>Weather App</h1>

        <form id="weatherForm">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                required
            >

            <button type="submit">
                Search
            </button>

        </form>

        <p id="message"></p>

        <section id="weatherContainer">

            <div class="location">
                <h2 id="cityName">--</h2>
                <p id="country">--</p>
            </div>

            <div class="weather-main">

                <img id="weatherIcon" src="" alt="Weather icon">

                <div>
                    <h2 id="temperature">--°C</h2>
                    <p id="description">--</p>
                    <p>Feels like <span id="feelsLike">--</span>°C</p>
                </div>

            </div>

            <div class="weather-details">

                <div>
                    <h3>Min Temperature</h3>
                    <p id="minTemp">--</p>
                </div>

                <div>
                    <h3>Max Temperature</h3>
                    <p id="maxTemp">--</p>
                </div>

                <div>
                    <h3>Humidity</h3>
                    <p id="humidity">--</p>
                </div>

                <div>
                    <h3>Pressure</h3>
                    <p id="pressure">--</p>
                </div>

                <div>
                    <h3>Wind Speed</h3>
                    <p id="windSpeed">--</p>
                </div>

                <div>
                    <h3>Wind Direction</h3>
                    <p id="windDirection">--</p>
                </div>

                <div>
                    <h3>Cloudiness</h3>
                    <p id="cloudiness">--</p>
                </div>

                <div>
                    <h3>Visibility</h3>
                    <p id="visibility">--</p>
                </div>

                <div>
                    <h3>Latitude</h3>
                    <p id="latitude">--</p>
                </div>

                <div>
                    <h3>Longitude</h3>
                    <p id="longitude">--</p>
                </div>

                <div>
                    <h3>Sunrise</h3>
                    <p id="sunrise">--</p>
                </div>

                <div>
                    <h3>Sunset</h3>
                    <p id="sunset">--</p>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
