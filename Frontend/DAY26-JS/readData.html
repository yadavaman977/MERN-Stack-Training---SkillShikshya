<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product fetch</title>
  </head>
   <style>
table,th,
td {
    border: 1px solid black;
}
    </style>
  <body>
    <h1>Products</h1>
    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Title</th>
                <th>Price</th>
                <th>Description</th>
                <th>Category</th>
                <th>Img</th>
            </tr>
        </thead>
        <tbody id="datalist"></tbody>
    </table>
  </body>
  <script>
    async function getProducts() {
      const response = await fetch("https://fakestoreapi.com/products");
      const data = await response.json();
      const table = document.getElementById("datalist");
      data.forEach((product) => {
        table.innerHTML += `<tr><td>${product.id}</td><td>${product.title}<td>${product.price}</td><td>${product.description}</td><td>${product.category}</td><td><img src="${product.image}" width="100"></td></tr>`;
      });
    }
    getProducts();
  </script>
</html>
