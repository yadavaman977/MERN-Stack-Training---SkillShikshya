<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Titan+One&display=swap"
            rel="stylesheet">
    </head>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    h1{
        color: blue;
        border: 1px solid black;
        margin: 200px 200px;
        padding: 20px 10px;
    }
    .home{
        color: red;
        border: 1px solid black;
        margin: 200px 200px;
        padding: 20px 10px;
        text-transform: capitalize;
    }

    #home{
        color: green;
        border: 1px solid black;
        margin: 200px 200px;
        padding: 20px 10px;
        font-size: 30px;
        font-size: 3rem;
        font-size: 2em;
        font-weight: bold;
        font-family: Arial, sans-serif;
        .titan-one-regular {
  font-family: "Titan One", sans-serif;
  font-weight: 400;
  font-style: normal;
}

    }


</style>
    <body>
        <!-- <h1 style="color: blue; border: 1px solid black; margin: 200px 200px; padding: 20px 10px;">Hello World</h1> -->
        <!-- <p>This is a simple HTML page with CSS styling.</p> -->
        <h1 class="home" id="home">Hello World</h1>
    </body>
</html>
